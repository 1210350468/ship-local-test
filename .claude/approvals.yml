# ship-local approval policy.  Copy to <repo>/.claude/approvals.yml on the DEFAULT branch.
#
# ship-local reads this file from the PR's *base* branch (origin/<base>), never from the PR
# itself, so a PR cannot loosen its own policy. Edits to .claude/** are never auto-approved.
#
# mode:
#   observe-only  (default) post a verdict comment only. `gh pr review --approve` is never run.
#   enforce       approve ONLY if every file falls in an allowed category and all limits hold.
# ship-local never merges and never force-pushes in either mode.
version: 1
mode: observe-only

approve:
  # Categories (defined below) that may be auto-approved in enforce mode. Empty = nothing.
  allowed_categories: [docs]
  max_changed_lines: 30        # additions + deletions
  max_changed_files: 5
  require_checks_green: true   # every check on the head commit must pass
  allow_when_no_checks: false  # if the repo has no CI at all, treat as not green
  require_review_clean: true   # latest ship-local review on the current head must have 0 findings

# Category -> glob patterns (matched against repo-relative paths; * crosses directories).
categories:
  docs:
    - "*.md"
    - "docs/**"
    - "LICENSE*"
  typo:
    - "*.txt"
  tests:
    - "tests/**"
    - "test_*.py"
  deps-lock:
    - "package-lock.json"
    - "poetry.lock"
    - "uv.lock"
